# PR: build and test only. main: build and test → push image → pin test.
# The app lives at the repo root, so docs/deploy-only changes are ignored
# instead of filtering on a component directory.
name: webapp

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - '.github/workflows/production.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - '.github/workflows/production.yml'
  workflow_dispatch:

concurrency:
  group: 'webapp-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: svelte-check
        run: npm run check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      # The cluster may run the image as a different non-root UID than its USER 101.
      - name: nginx config as UID 1000
        run: |
          docker run --rm --user 1000 \
            -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/docker/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine \
            nginx -t

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  image:
    name: Build and push image
    needs: [test, rules]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/webapp
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - name: Image tag
        id: tag
        run: echo "value=$(bash .github/scripts/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp

  pin:
    name: Pin test
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SERVICE: web # must match the key in deploy/mimir/services.*.yaml
    steps:
      - uses: actions/checkout@v6

      - name: Pin tag in test
        run: bash .github/scripts/pin-test-and-push.sh "$SERVICE" "${{ needs.image.outputs.tag }}"
