server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index 200.html;

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anonymous probe targets that never touch the SPA. Static nginx has no
    # dependencies, so liveness and readiness are equivalent.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # The SPA shell must be revalidated so a new deploy is picked up.
        add_header Cache-Control "no-cache";
        try_files $uri /200.html;
    }
}
