# basstabs — test environment (CI pins services.web.image.tag on every main push).
# Keep the tag double-quoted: pin-image-tag.sh only matches tag: "...".
# Hostnames live in mimir operator values, not here.
services:
  web:
    image:
      tag: "26.10.01-15.08-01ec8f4"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 80
        visibility: internet
    probes:
      port: http
      liveness:
        path: /healthz
      readiness:
        path: /readyz
