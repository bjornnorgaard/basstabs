# basstabs — production. Promote tags manually via .github/workflows/production.yml
# (copies from services.test.yaml). Never auto-bump from main CI.
# Keep the tag double-quoted: pin-image-tag.sh only matches tag: "...".
# Hostnames live in mimir operator values, not here.
services:
  web:
    image:
      tag: "26.10.03-18.12-0a30d05"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 80
        visibility: internet
    probes:
      port: http
      liveness:
        path: /healthz
      readiness:
        path: /readyz
